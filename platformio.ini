; Build com PlatformIO. O mesmo codigo tambem compila na Arduino IDE abrindo
; firmware/Kroma/Kroma.ino.
;
;   pio run                # compila
;   pio run -t upload      # grava
;   pio device monitor     # abre a serial em 115200

[platformio]
src_dir = firmware/Kroma

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -Wall -Wextra
lib_deps =
    adafruit/Adafruit TCS34725@^1.4.4
    olikraus/U8g2@^2.35.19
